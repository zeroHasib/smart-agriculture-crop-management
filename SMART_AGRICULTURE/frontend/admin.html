
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Smart Agriculture</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #eef4ee;
        }

        .login-container {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.10);
        }

        .login-container h1 {
            text-align: center;
            color: #1b5e20;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #777;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 15px;
        }

        input:focus {
            outline: none;
            border-color: #2e7d32;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2e7d32;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #1b5e20;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        #message {
            margin-top: 18px;
            text-align: center;
            font-size: 14px;
        }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2e7d32;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>Admin Login</h1>

        <p class="subtitle">
            Smart Agriculture Management System
        </p>

        <form id="adminLoginForm">

            <label for="email">Admin Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter admin email"
                required
            >

            <label for="password">Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter password"
                required
            >

            <button type="submit" id="loginBtn">
                Login as Admin
            </button>

        </form>

        <p id="message"></p>

        <a href="index.html" class="back-link">
            Back to Farmer Panel
        </a>

    </div>

    <script>
        const loginForm = document.getElementById("adminLoginForm");
        const message = document.getElementById("message");
        const loginBtn = document.getElementById("loginBtn");

        loginForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;

            loginBtn.disabled = true;
            loginBtn.textContent = "Logging in...";
            message.textContent = "";

            try {

                const response = await fetch("/api/admin/login", {
                    method: "POST",
                    credentials: "same-origin",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        email: email,
                        password: password
                    })
                });

                const result = await response.json();

                if (result.success) {

                    message.style.color = "green";
                    message.textContent = "Admin login successful!";

                    sessionStorage.setItem("adminLoggedIn", "true");

                    setTimeout(function() {
                        window.location.href = "admin-dashboard.html";
                    }, 1000);

                } else {

                    message.style.color = "red";
                    message.textContent = result.message || "Login failed.";

                }

            } catch (error) {

                message.style.color = "red";
                message.textContent = "Server connection failed.";

                console.error(error);

            } finally {

                loginBtn.disabled = false;
                loginBtn.textContent = "Login as Admin";

            }

        });
    </script>

</body>
</html>
